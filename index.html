/* ============================================================
   АНТИ-КЭШ (почему после замены файлов ничего не менялось):
   python -m http.server и npm-серверы НЕ шлют заголовки запрета
   кэша, и браузер продолжает показывать СТАРЫЕ js-файлы.
   1) Ко всем скриптам/стилям ниже добавлен ?v=091 — браузер
      считает их новыми адресами и качает заново.
   2) Если в адресе нет ?v= — страница один раз перезагружается
      с ?v=091 (свежий index.html гарантированно).
   3) В меню есть ссылка «обновить кэш» (js/main.js).
   ============================================================ */
(function () {
  var V = '095';
  window.BRIX_V = V;
  window.BRIX_VER = '0.4.66';   /* ✅ v0.4.64 ДВА СЕРВЕРА (BrixLand + BrixPvP арена): + ХП ПОСТРОЕК ПРОВЕРКА + 3D-ФИКС + СТАРЫЕ ИГРОКИ:
   (BRIX_VER НЕ поднимаем — SRV_VER=0.4.52, баннера «СЕРВЕР СТАРЫЙ» нет.
   server.js обновлён — ЗАМЕНИТЬ И ПЕРЕЗАПУСТИТЬ, см. README-FIX-v0.4.63.txt.
   ВНИМАНИЕ: ПОЛНЫЙ архив v0.4.63 БОЛЬШЕ НЕ СОДЕРЖИТ файлы мира
   (world-objs.json, players.json, social.json, admins.json, world-env.json,
   world-epoch.json) — распаковка поверх сервера больше не затирает
   твой мир и админов!)
   1) АДМИН-ПАНЕЛЬ (9): секция «МОНЕТЫ — НАЧИСЛИТЬ СЕБЕ» — вводишь
      количество, жмёшь НАЧИСЛИТЬ (баланс рядом, сразу видно).
      Плюс прежний топ-ап админа до 10000 при входе.
   2) ХП ПОСТРОЕК — ПРОВЕРЕНА ВСЯ ЦЕПОЧКА (WS-тест с настоящим
      протоколом): удар → bhp всем → сохранение на диск сразу →
      перезаход → welcome.objs.bd несёт hp/max каждой детали —
      новички и перезашедшие видят повреждённые постройки. Дыр нет.
   4) ДВА СЕРВЕРА (v0.4.64): BRIX • BrixLand (выживание, 8787) и
      BRIX • BrixPvP (пвп-арена «Пепел», 8788) — вкладка СЕРВЕРА
      переделана в СПИСОК СЕРВЕРОВ с живыми счётчиками онлайна
      у каждого, у каждого свои сейвы (data/<realm>/) и свои игроки;
      на арене: без хотбара и крафта, E — список всего оружия
      (булава, револьвер, 3×, дробовик, калаш, томпсон, С4),
      патроны бесконечные (перезарядка на месте), свой рельеф
      (другой сид террейна), арена без леса с валунами-укрытиями;
      карточки «СЛУЖЕБНЫЙ СЕРВЕР»/«Последний сервер» и надписи
      ADMIN убраны; магазин скинов (вкладка СКИНЫ) — только для
      админов (по admins.json сервера).
   3) СКИНЫ — ПОЛНЫЙ ФИКС (3D-осмотр + В РУКАХ + У ЧУЖИХ):
      · в РУКАХ железный топор «Ледяные руны» и железная кирка «Ретро»
        вообще не надевали скин (у скинов не было держателей в списке,
        «Ретро» был приписан каменной кирке) — теперь надеваются;
      · «криво» в руках у револьвера/томпсона/С4/кам. топора: у моделей
        metalness=1 (умолчание glTF), у Экскимо свои карты с шероховатостью
        ≈0.2 («жидкий» глянец) — теперь у всех скинов единый витринный
        материал (metalness 0.15 / roughness 0.6), как в 3D-осмотре;
      · у ЧУЖИХ игроков скины не показывались ВООБЩЕ (id скина искали в
        BrixItems, где скинов нет) — исправлено, тот же витринный вид;
      · снятие скина возвращает и факторы материала (без остаточного
        глянца).
   4) «ВСЕ ИГРОКИ» ТЕПЕРЬ ПОКАЗЫВАЕТ И СТАРЫХ ИГРОКОВ (с 1-го релиза):
      сервер собирает имена из мира — builds[].by (кто строил) и
      corpses[].n (кто погиб, труп-лутбокс) с датами — в реестр
      social.json; добирает новые имена раз в 60 с. У каждого
      «в сети сейчас» / «был(а) N мин/ч/дн назад», профиль с
      ПРИГЛАСИТЬ работает как у живых.
   —— История v0.4.62 (СИНХРОН ПОСТРОЕК + МАГАЗИН 3D + ДРУЗЬЯ):
   (BRIX_VER НЕ поднимаем — SRV_VER=0.4.52, иначе баннер «СЕРВЕР СТАРЫЙ».
   НО: server.js ОБНОВЛЁН (надгробия построек + реестр игроков + 'plist') —
   ЗАМЕНИТЬ И ПЕРЕЗАПУСТИТЬ СЕРВЕР, см. README-FIX-v0.4.62.txt.)
   1) ПОСТРОЙКИ (фикс «сломанное воскресает»): бэкап localStorage чистится
      при сломании (removeRecord → saveLocal) + сервер хранит НАДГРОБИЯ
      сломанных (world-objs.json btomb, 600 шт.) — badopt больше не добирает
      сломанное обратно после перезапуска и перезахода игроков.
   2) СКИН «РЕТРО» теперь на ЖЕЛЕЗНОЙ кирке (обёртка рисовалась по её UV).
   3) СУТКИ = 47 МИНУТ (рассвет 198 с, день ~19.8 мин, закат 297 с,
      сумерки 148 с, ночь 16.5 мин) — сервер + клиент, 1:1.
   4) АДМИНАМ 10000 МОНЕТ при подтверждении админа (если меньше 10000).
   5) Вкладка «СКИНЫ» → «МАГАЗИН». Клик по картинке скина — 3D-ОСМОТР:
      настоящая модель без рук, крутится мышью/пальцем, кнопка КУПИТЬ.
   6) ПУЛИ ЛЕТЯТ: урон и хит-маркер приходят, когда трассер ДОЛЕТЕЛ
      (дистанция/скорость); скорости пуль чуть выше (240/300/300/400/170 →
      300/370/370/480/210).
   7) ДРУЗЬЯ: вкладки «ДРУЗЬЯ» и «ВСЕ ИГРОКИ» (все, кто играл/играет,
      «был N ч назад», клик по игроку → ПРОФИЛЬ с ПРИГЛАСИТЬ/УДАЛИТЬ).
      Заявка приходит в КОЛОКОЛЬЧИК — «вам предложили дружить» +
      Принять/Игнорировать. Сервер ведёт реестр игроков (social.json).
   —— История v0.4.61 (СКИН ЖЕЛЕЗНОГО ТОПОРА «ЛЕДЯНЫЕ РУНЫ»):
   1) НОВЫЙ СКИН (арт игрока): железный топор «Ледяные руны» — лёд со
      светящимися рунами по развёртке iron_axe.glb. Магазин (400 монет,
      редкий) + крафт-меню (Q): иконка предмета → список скинов.
      Иконка скина — 3D-рендер модели с обёрткой (форма как у оригинала).
   2) ФИКС ОРИЕНТАЦИИ ОБЁРТОК: weaponskins.js getTex — flipY=false
      (конвенция glTF, как в glb.js); раньше обёртка ложилась вверх ногами.
   —— История v0.4.52 (СИГНАЛЫ СЕРВЕРУ + ПЛАВНЫЕ ПЕРЕХОДЫ):
   1) АДМИН-ПАНЕЛЬ (9): ПОГОДА И ВРЕМЯ — СИГНАЛЫ СЕРВЕРУ (ЯСНО/ХМУРО,
      РАССВЕТ/ДЕНЬ/ЗАКАТ/СУМЕРКИ/НОЧЬ) — сервер меняет envState и сразу
      рассылает всем 'dnc' + объявление 'atoast'; state в world-env.json.
      ПРОХОД СКВОЗЬ СТЕНЫ (noclip): полёт насквозь стен/дверей/окон —
      Space вверх, C вниз (controls.js setNoclip).
   2) ПЛАВНЫЕ ПЕРЕХОДЫ ТУЧИ↔СВЕТ: сглаживание в environment.js — солнце,
      ТЕНИ и туман гаснут/загораются мягко при ЛЮБОЙ смене погоды;
      большой скачок времени суток (сигнал админа) небо «проезжает».
   3) ОБЛАКА В ЯСНУЮ ПОГОДУ: 20 мягких облаков (было 12), заметнее,
      закат красит их в золото, ночью темнеют.
   4) ГРОЗА (фича 1): молнии (вспышка неба + мерцающий свет, тени)
      и гром с задержкой — storm.js + assets/sfx/weather/thunder*.wav.
   5) РАДУГА ПОСЛЕ ДОЖДЯ (фича 2): кольцо напротив солнца, тает ~50 с
      (шейдер неба world.js).
   6) ФИКС: с БЕССМЕРТИЕМ больше не умираешь от высоты (god в
      onFallDamage + сервер не принимает pdeath от god).
   —— История v0.4.51 (СУТКИ И ПОГОДА НА СЕРВЕРЕ):
   1) СУТКИ: рассвет 2 мин → день 12 мин → закат 3 мин → сумерки 1.5 мин
      → ночь 10 мин (цикл 28.5 мин). Время ТИКАЕТ НА СЕРВЕРЕ (server.js
      шлёт 'dnc' раз в секунду + кладёт в welcome.dnc) — у всех игроков
      синхронно; в соло/вкладках — те же часы локально. ЖИВОЕ НЕБО:
      солнце ходит по небосводу, закатное зарево, звёзды и луна ночью,
      туман и экспозиция дышат со светом, вода меняет цвет.
   2) ПОГОДА: ясно 20 мин ↔ хмуро 15 мин — тёмные тучи ЗАКРЫВАЮТ СОЛНЦЕ,
      густой туман, 3D-ДОЖДЬ (GPU-частицы вокруг камеры, ФПС не падает)
      и тихий бесшовный звук дождя. В ЗИМЕ вместо дождя — СНЕГ, переход
      плавный (снеговая линия).
   3) ХОЛОД НОЧЬЮ В ЗИМЕ ×2 (серверная фаза суток, у всех одинаково).
   4) Часы HUD: «07:15 · День · Хмуро».
   —— История v0.4.50:
   1) ФИКС «С4 ПРОПАДАЕТ В ГОРАХ/ХОЛМАХ»: страховка полёта мерила дистанцию
      от ЦЕНТРА КАРТЫ (135 м), а карта 900 м — за спавн-плато (там как раз
      холмы и горы) блок удалялся в первый же кадр. Теперь радиус — от
      ТОЧКИ БРОСКА (gameworld.js tickC4).
   2) ЗВУК ШПРИЦА (файл игрока): «шприц воткнулся в руку» — звук жидкости
      (assets/sfx/syringe/inject.mp3) играет в момент входа иглы (2.5 с
      клипа, SYR_NEEDLE_T). +46 хп по-прежнему на продавливании (3.45 с).
   3) ТРУПЫ: незалутанный труп исчезает через 10 МИНУТ (было 20 для всех);
      с которого уже что-то взяли — 20 минут страховки; опустел — сразу
      (server.js + corpses.js — в соло/вкладках тоже).
   4) ИКОНКИ: 21 предмет заменён на обновлённые иконки игрока (ICONS.zip):
      булава, дробовик, томпсон, револьверы, калаш-корпус, патроны, С4,
      топоры/кирки, руда/сера/дерево/камень/метал, труба, план строителя.
   5) ФОН МЕНЮ: картинка игрока «меню.png» → assets/menu/bg.jpg
      (только в главном меню, игра не затронута).
   —— Предыдущее v0.4.49 (шприц на своём риге): ретаргет модели шприца
   полностью убран — он делал руки гигантскими/«обрезаными» и ронял шприц
   с кисти. Шприц запечён в предмет в ПРАВОЙ кисти (поршень-кнопка —
   отдельный меш, реально продавливается при уколе). АНИМАЦИЯ УКОЛА СВОЯ,
   процедурная, на наших костях: правая рука подносит шприц, левая
   подставляет предплечье ладонью вверх, правая вдавливает иглу в левую
   руку (кончик иглы привязан к ригу — точность не зависит от кейфреймов).
   Тайминг +46 хп прежний — 3.45 с.
   —— Предыдущее v0.4.46: 1) под лестницей проход только в приседе,
   2) сохранение игрока (позиция + инвентарь + слот хотбара), 3) С4
   стакается по 10, 4) фикс «два калаша в сундуке стакаются», 5) шприц
   (+46 хп, крафт, военные ящики, стак 10) */
  window.BrixAsset = function (u) { return u + (u.indexOf('?') < 0 ? '?' : '&') + 'v=' + V; };
  try {
    var p = window.location.protocol;
    if (p === 'http:' || p === 'https:') {
      if (/[?&]v=/.test(window.location.search)) {
        sessionStorage.removeItem('brixVjump');
      } else if (!sessionStorage.getItem('brixVjump')) {
        sessionStorage.setItem('brixVjump', '1');
        var s = window.location.search;
        window.location.replace(
          window.location.pathname + (s ? s + '&v=' + V : '?v=' + V) + window.location.hash
        );
      }
    }
  } catch (e) { /* file:// — работаем как есть */ }
})();
</script>

          'скопируйте файл из архива в папку js/core/ и обновите страницу (Ctrl+Shift+R)');
      }
      return key;
    }
  };
}
</script>
