<script>
/* ============================================================
   АНТИ-КЭШ (почему после замены файлов ничего не менялось):
   python -m http.server и npm-серверы НЕ шлют заголовки запрета
   кэша, и браузер продолжает показывать СТАРЫЕ js-файлы.
   1) Ко всем скриптам/стилям ниже добавлен ?v=091 — браузер
      считает их новыми адресами и качает заново.
   2) Если в адресе нет ?v= — страница один раз перезагружается
      с ?v=091 (свежий index.html гарантированно).
   3) В меню есть ссылка «обновить кэш» (js/main.js).
   ============================================================ */
(function () {
  var V = '091';
  window.BRIX_V = V;
  window.BRIX_VER = '0.4.52';   /* ✅ v0.4.52 (СИГНАЛЫ СЕРВЕРУ + ПЛАВНЫЕ ПЕРЕХОДЫ):
   1) АДМИН-ПАНЕЛЬ (9): ПОГОДА И ВРЕМЯ — СИГНАЛЫ СЕРВЕРУ (ЯСНО/ХМУРО,
      РАССВЕТ/ДЕНЬ/ЗАКАТ/СУМЕРКИ/НОЧЬ) — сервер меняет envState и сразу
      рассылает всем 'dnc' + объявление 'atoast'; state в world-env.json.
      ПРОХОД СКВОЗЬ СТЕНЫ (noclip): полёт насквозь стен/дверей/окон —
      Space вверх, C вниз (controls.js setNoclip).
   2) ПЛАВНЫЕ ПЕРЕХОДЫ ТУЧИ↔СВЕТ: сглаживание в environment.js — солнце,
      ТЕНИ и туман гаснут/загораются мягко при ЛЮБОЙ смене погоды;
      большой скачок времени суток (сигнал админа) небо «проезжает».
   3) ОБЛАКА В ЯСНУЮ ПОГОДУ: 20 мягких облаков (было 12), заметнее,
      закат красит их в золото, ночью темнеют.
   4) ГРОЗА (фича 1): молнии (вспышка неба + мерцающий свет, тени)
      и гром с задержкой — storm.js + assets/sfx/weather/thunder*.wav.
   5) РАДУГА ПОСЛЕ ДОЖДЯ (фича 2): кольцо напротив солнца, тает ~50 с
      (шейдер неба world.js).
   6) ФИКС: с БЕССМЕРТИЕМ больше не умираешь от высоты (god в
      onFallDamage + сервер не принимает pdeath от god).
   —— История v0.4.51 (СУТКИ И ПОГОДА НА СЕРВЕРЕ):
   1) СУТКИ: рассвет 2 мин → день 12 мин → закат 3 мин → сумерки 1.5 мин
      → ночь 10 мин (цикл 28.5 мин). Время ТИКАЕТ НА СЕРВЕРЕ (server.js
      шлёт 'dnc' раз в секунду + кладёт в welcome.dnc) — у всех игроков
      синхронно; в соло/вкладках — те же часы локально. ЖИВОЕ НЕБО:
      солнце ходит по небосводу, закатное зарево, звёзды и луна ночью,
      туман и экспозиция дышат со светом, вода меняет цвет.
   2) ПОГОДА: ясно 20 мин ↔ хмуро 15 мин — тёмные тучи ЗАКРЫВАЮТ СОЛНЦЕ,
      густой туман, 3D-ДОЖДЬ (GPU-частицы вокруг камеры, ФПС не падает)
      и тихий бесшовный звук дождя. В ЗИМЕ вместо дождя — СНЕГ, переход
      плавный (снеговая линия).
   3) ХОЛОД НОЧЬЮ В ЗИМЕ ×2 (серверная фаза суток, у всех одинаково).
   4) Часы HUD: «07:15 · День · Хмуро».
   —— История v0.4.50:
   1) ФИКС «С4 ПРОПАДАЕТ В ГОРАХ/ХОЛМАХ»: страховка полёта мерила дистанцию
      от ЦЕНТРА КАРТЫ (135 м), а карта 900 м — за спавн-плато (там как раз
      холмы и горы) блок удалялся в первый же кадр. Теперь радиус — от
      ТОЧКИ БРОСКА (gameworld.js tickC4).
   2) ЗВУК ШПРИЦА (файл игрока): «шприц воткнулся в руку» — звук жидкости
      (assets/sfx/syringe/inject.mp3) играет в момент входа иглы (2.5 с
      клипа, SYR_NEEDLE_T). +46 хп по-прежнему на продавливании (3.45 с).
   3) ТРУПЫ: незалутанный труп исчезает через 10 МИНУТ (было 20 для всех);
      с которого уже что-то взяли — 20 минут страховки; опустел — сразу
      (server.js + corpses.js — в соло/вкладках тоже).
   4) ИКОНКИ: 21 предмет заменён на обновлённые иконки игрока (ICONS.zip):
      булава, дробовик, томпсон, револьверы, калаш-корпус, патроны, С4,
      топоры/кирки, руда/сера/дерево/камень/метал, труба, план строителя.
   5) ФОН МЕНЮ: картинка игрока «меню.png» → assets/menu/bg.jpg
      (только в главном меню, игра не затронута).
   —— Предыдущее v0.4.49 (шприц на своём риге): ретаргет модели шприца
   полностью убран — он делал руки гигантскими/«обрезаными» и ронял шприц
   с кисти. Шприц запечён в предмет в ПРАВОЙ кисти (поршень-кнопка —
   отдельный меш, реально продавливается при уколе). АНИМАЦИЯ УКОЛА СВОЯ,
   процедурная, на наших костях: правая рука подносит шприц, левая
   подставляет предплечье ладонью вверх, правая вдавливает иглу в левую
   руку (кончик иглы привязан к ригу — точность не зависит от кейфреймов).
   Тайминг +46 хп прежний — 3.45 с.
   —— Предыдущее v0.4.46: 1) под лестницей проход только в приседе,
   2) сохранение игрока (позиция + инвентарь + слот хотбара), 3) С4
   стакается по 10, 4) фикс «два калаша в сундуке стакаются», 5) шприц
   (+46 хп, крафт, военные ящики, стак 10) */
  window.BrixAsset = function (u) { return u + (u.indexOf('?') < 0 ? '?' : '&') + 'v=' + V; };
  try {
    var p = window.location.protocol;
    if (p === 'http:' || p === 'https:') {
      if (/[?&]v=/.test(window.location.search)) {
        sessionStorage.removeItem('brixVjump');
      } else if (!sessionStorage.getItem('brixVjump')) {
        sessionStorage.setItem('brixVjump', '1');
        var s = window.location.search;
        window.location.replace(
          window.location.pathname + (s ? s + '&v=' + V : '?v=' + V) + window.location.hash
        );
      }
    }
  } catch (e) { /* file:// — работаем как есть */ }
})();
</script>

  </div>
</div>

<div class="app">

  <!-- ================= МЕНЮ ================= -->
  <div id="menuChrome" style="position:absolute;inset:0">
    <!-- живой 3D-фон: ночная сцена -->
    <div id="bgScene"></div>
    <div class="rust-vignette overlay"></div>
    <div class="rust-grain overlay"></div>

    <!-- шапка -->
    <header class="topbar" id="topbar"></header>

    <!-- десктопный сайдбар -->
    <div class="sidebar-col">
      <nav id="mainNav"></nav>
      <div class="sidebar-version" id="sidebarVersion"></div>
    </div>

    <!-- слои экранов -->
    <div id="screenHost"></div>

    <!-- соц-панель справа -->
    <div class="social-rail" id="socialRail"></div>

    <!-- версия на мобильных -->
    <div class="mobile-version" id="mobileVersion"></div>
  </div>

  <!-- ================= ИГРА ================= -->
  <div id="gameLayer" class="game-layer hidden">
    <div id="gameMount"></div>

    <!-- HUD -->
    <div id="gameHud" class="hud hidden">
      <div class="cross-wrap"><div class="hud-crosshair"></div></div>
      <div class="hud-server">
        <div class="name" id="hudServerName"></div>
        <div class="info" id="hudServerInfo"></div>
      </div>
      <div class="hud-stats">
        <div><span id="hudFpsCap"></span><span class="v" id="hudFps">0</span></div>
        <div style="margin-top:2px"><span id="hudPosCap"></span><span class="v" id="hudPos">0 · 0 · 0</span></div>
        <div style="margin-top:2px"><span id="hudTimeCap"></span><span class="v" id="hudTime"></span></div>
      </div>
      <div class="hud-hint" id="hudHint"></div>
    </div>

    <!-- пауза / ожидание захвата мыши -->
    <div id="pauseOverlay" class="pause-overlay hidden">
      <div class="rust-card pause-card">
        <h3 class="font-h" id="pauseTitle"></h3>
        <p class="hint" id="pauseHint"></p>
        <div class="btns">
          <button class="btn-rust-primary" id="btnResume"></button>
          <button class="btn-rust" id="btnDisconnect"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= ЭКРАН ЗАГРУЗКИ ================= -->
  <div id="loadingScreen" class="loading-screen hidden">
    <div class="rust-grain"></div>
    <div class="rust-vignette"></div>
    <img class="logo" src="assets/icon.png" alt="">
    <h2 class="font-h" id="loadingTitle"></h2>
    <p class="srv" data-server></p>
    <p class="stage" id="loadingStage"></p>
    <div class="loadbar loading-bar"><div class="fill" id="loadingFill" style="width:0%"></div></div>
    <div class="pct font-h" id="loadingPct">0%</div>
    <p class="tip" id="loadingTip"></p>
  </div>

  <!-- диалог выхода и прощание -->
  <div id="quitRoot"></div>

  <!-- тосты -->
  <div id="toastRoot" style="pointer-events:none"></div>
</div>

<script>
/* ✅ v0.4.22 ЗАЩИТА ОТ ПАДЕНИЯ МЕНЮ: если js/core/i18n.js не скопирован
   на сервер (404 — самый частый пропуск при установке обновлений),
   раньше state.js падал с «BrixI18N is not defined» и меню не открывалось.
   Теперь без словаря игра просто показывает ключи вместо переводов */
if (!window.BrixI18N) {
  window.BrixI18N = {
    translate: function (lang, key) {
      if (window.console) {
        console.warn('[BRIX] js/core/i18n.js не найден на сервере — ' +
          'скопируйте файл из архива в папку js/core/ и обновите страницу (Ctrl+Shift+R)');
      }
      return key;
    }
  };
}
</script>
